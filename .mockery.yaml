# mockery v3 configuration
# https://vektra.github.io/mockery/latest/configuration/

# Global settings
# Application mocks are generated inline: same directory and same package as the
# source interface (dir=InterfaceDir, pkgname=SrcPackageName). The commons mocks
# below override dir/pkgname to land in internal/testutil/mocks instead.
all: false
dir: "{{.InterfaceDir}}"
filename: "mock_{{.InterfaceName | snakecase}}.go"
structname: "Mock{{.InterfaceName}}"
pkgname: "{{.SrcPackageName}}"
template: testify
formatter: goimports
log-level: info

packages:
  # ===== Application aggregates (repository port + event factory per aggregate) =====
  github.com/Sokol111/ecommerce-catalog-service/internal/application/product:
    interfaces:
      Repository:
      ProductEventFactory:

  github.com/Sokol111/ecommerce-catalog-service/internal/application/category:
    interfaces:
      Repository:
      CategoryEventFactory:

  github.com/Sokol111/ecommerce-catalog-service/internal/application/attribute:
    interfaces:
      Repository:
      AttributeEventFactory:

  # ===== External Dependencies (ecommerce-commons) =====
  # Generated into internal/testutil/mocks as package mocks.
  github.com/Sokol111/ecommerce-commons/pkg/messaging/patterns/outbox:
    config:
      dir: "internal/testutil/mocks"
      pkgname: "mocks"
    interfaces:
      Outbox:

  github.com/Sokol111/ecommerce-commons/pkg/persistence/mongo:
    config:
      dir: "internal/testutil/mocks"
      pkgname: "mocks"
    interfaces:
      TxManager:
